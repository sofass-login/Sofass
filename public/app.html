<style>
  :root{
    --bg:#EDEFE4;
    --surface:#FFFFFF;
    --surface-2:#E2E6D4;
    --ink:#16222D;
    --ink-soft:#69756A;
    --accent:#B0742A;
    --accent-ink:#FFFFFF;
    --accent-2:#215B4C;
    --accent-2-ink:#FFFFFF;
    --accent-3:#33475C;
    --accent-3-ink:#FFFFFF;
    --danger:#B14632;
    --border:#DBDFCC;
    --radius:12px;
    --shadow:0 1px 2px rgba(20,26,20,.05), 0 10px 28px -14px rgba(20,26,20,.22);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131A17; --surface:#1C2521; --surface-2:#25302A;
      --ink:#E8ECE1; --ink-soft:#8FA093;
      --accent:#E0A354; --accent-ink:#1A1206;
      --accent-2:#5FA890; --accent-2-ink:#08160F;
      --accent-3:#8CA4B8; --accent-3-ink:#101820;
      --danger:#E2836A; --border:#324139;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131A17; --surface:#1C2521; --surface-2:#25302A;
    --ink:#E8ECE1; --ink-soft:#8FA093;
    --accent:#E0A354; --accent-ink:#1A1206;
    --accent-2:#5FA890; --accent-2-ink:#08160F;
    --accent-3:#8CA4B8; --accent-3-ink:#101820;
    --danger:#E2836A; --border:#324139;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    min-height:100%; -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% -8%, rgba(224,163,84,.20), transparent 55%), #0A0D0B;color:#F4F2E9;}
  .gate-watermark{position:absolute;top:52%;left:50%;width:1000px;max-width:none;transform:translate(-50%,-50%) rotate(-6deg);opacity:.055;pointer-events:none;}
  .gate-logo-mark{width:min(72vw,300px);height:auto;margin-bottom:24px;position:relative;z-index:1;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));animation:gate-fade-down .6s ease both;}
  .gate h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,6vw,2.9rem);margin:0 0 6px;letter-spacing:-0.01em;position:relative;z-index:1;color:#F4F2E9;animation:gate-fade-up .6s ease .1s both;}
  .gate p.lead{color:rgba(244,242,233,.66);margin:0 0 40px;font-size:1rem;max-width:34ch;position:relative;z-index:1;animation:gate-fade-up .6s ease .18s both;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:640px;position:relative;z-index:1;animation:gate-fade-up .6s ease .26s both;}
  @media (max-width:560px){ .role-grid{grid-template-columns:1fr;} }
  @keyframes gate-fade-down{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes gate-fade-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .role-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid transparent;border-radius:14px;padding:28px 22px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .15s ease, transform .15s ease;}
  .role-card:hover{border-color:var(--accent);border-top-color:var(--accent);transform:translateY(-2px);}
  .role-card .icon{width:34px;height:34px;color:var(--accent);}
  .role-card h3{font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin:4px 0 0;}
  .role-card p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.5;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:1.1rem;}
  .brand .icon{width:22px;height:22px;color:var(--accent);}
  .brand-mark{width:24px;height:24px;border-radius:6px;display:block;flex-shrink:0;}
  .who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);}
  .who b{color:var(--ink);font-weight:600;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .btn-accent:hover{opacity:.92;}
  .btn-teal{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-2-ink);font-weight:600;}
  .btn-teal:hover{opacity:.92;}
  .btn-navy{background:var(--accent-3);border-color:var(--accent-3);color:var(--accent-3-ink);font-weight:600;}
  .btn-navy:hover{opacity:.92;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{border-color:var(--border);}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:.78rem;}
  .btn-block{width:100%;}

  .maintabs{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:19;}
  .maintabs button{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-soft);font-size:.85rem;font-weight:600;}
  .maintabs button:hover{background:var(--surface-2);color:var(--ink);}
  .maintabs button.active{background:var(--ink);color:var(--bg);box-shadow:inset 0 -3px 0 var(--accent);}
  .maintabs .icon{width:16px;height:16px;}

  .main{max-width:760px;margin:0 auto;padding:22px 18px 70px;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h2{font-family:var(--font-display);font-size:1.4rem;font-weight:600;margin:0;}
  .section-head p{margin:4px 0 0;color:var(--ink-soft);font-size:.86rem;}
  .eyebrow{font-family:var(--font-mono);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px;min-width:110px;}
  .stat:nth-child(4n+2){border-left-color:var(--accent-2);}
  .stat:nth-child(4n+3){border-left-color:var(--accent-3);}
  .stat:nth-child(4n+4){border-left-color:var(--danger);}
  .stat .n{font-family:var(--font-display);font-size:1.5rem;font-weight:600;}
  .stat .l{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}

  .subnav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .subnav button{padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font-size:.84rem;font-weight:600;}
  .subnav button:hover{border-color:var(--accent);}
  .subnav button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar input[type=text], .toolbar input[type=date]{flex:1;min-width:140px;padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.88rem;}
  .toolbar select{padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.88rem;}
  .filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select{flex:1;min-width:130px;padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.86rem;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
  .empty{position:relative;overflow:hidden;padding:34px 18px;text-align:center;color:var(--ink-soft);border:1px dashed var(--border);border-radius:10px;font-size:.88rem;line-height:1.7;}
  .empty::before{content:'';position:absolute;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%);background-image:var(--empty-mark);background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.05;pointer-events:none;}
  .empty span{position:relative;z-index:1;}

  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  thead th{font-family:var(--font-mono);text-align:left;font-size:.68rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.87rem;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}

      const byKey = new Map(existing.map(r => [keyOf(r.data || {}), r.id]));

      docs.forEach(([id, data]) => {
        if(col === 'families') data = { ...data, groupId: groupIdMap[data.groupId] || data.groupId };
        const found = byKey.get(keyOf(data));
        if(found){ if(col === 'familyGroups') groupIdMap[id] = found; return; }
        if(!ids.has(id)) rows.push({ collection: col, id, data });

    const { error: e4 } = await supabase.from(TABLE)
      .insert({ ...MARK, data: { at: Date.now(), added: rows.length } });
    if(e4) throw e4;
  }catch(e){ console.error('Importación del prototipo', e); }
}

async function start(){
  const cfgRes = await fetch('/api/public-config', {credentials:'same-origin'});
  if(cfgRes.redirected || !cfgRes.ok){ location.href = '/login'; return new Promise(()=>{}); }
  const cfg = await cfgRes.json();
  const supabase = createBrowserClient(cfg.url, cfg.anonKey);
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ location.href = '/login'; return new Promise(()=>{}); }

  const caches = {};      // collection -> Map(id -> data)
  const listeners = {};   // collection -> Set(cb)

  function emit(col){
    const map = caches[col]; if(!map) return;
    const docs = Array.from(map, ([id, data]) => ({ id, data: () => data }))
      .sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    (listeners[col] || []).forEach(cb => { try{ cb({ docs }); }catch(e){ console.error(e); } });
  }

  async function loadCollection(col){
    const map = new Map();
    for(let from = 0; ; from += PAGE){
      const { data, error } = await supabase.from(TABLE).select('id,data')
        .eq('collection', col).order('id').range(from, from + PAGE - 1);
      if(error) throw error;
      data.forEach(r => map.set(r.id, r.data || {}));
      if(data.length < PAGE) break;
    }
    caches[col] = map;
    emit(col);
  }

  supabase.channel('app_docs_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, payload => {
      const row = payload.eventType === 'DELETE' ? payload.old : payload.new;
      if(!row || !row.collection || !caches[row.collection]) return;
      if(payload.eventType === 'DELETE') caches[row.collection].delete(row.id);
      else caches[row.collection].set(row.id, row.data || {});
      emit(row.collection);
    })
    .subscribe();

  function newId(){
    return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2))).replace(/-/g, '');
  }
  function splitPath(path){
    const i = path.indexOf('/');
    return [path.slice(0, i), path.slice(i + 1)];
  }
  function localSet(col, id, data){
    if(!caches[col]) return;
    caches[col].set(id, data); emit(col);
  }

  const db = {
    collection(col){
      return {
        onSnapshot(cb, errCb){
          (listeners[col] = listeners[col] || new Set()).add(cb);
          if(caches[col]) emit(col);
          else loadCollection(col).catch(e => { console.error(e); if(errCb) errCb(e); });
          return () => listeners[col].delete(cb);
        },
        async add(data){
          const id = newId();
          const { error } = await supabase.from(TABLE).insert({ collection: col, id, data });
          if(error) throw error;
          localSet(col, id, data);
          return { id };
        },
      };
    },
    doc(path){
      const [col, id] = splitPath(path);
      return {
        async set(data){
          const { error } = await supabase.from(TABLE).upsert({ collection: col, id, data });
          if(error) throw error;
          localSet(col, id, data);
        },
        async update(patch){
          const { data, error } = await supabase.rpc('app_doc_merge', { p_collection: col, p_id: id, p_patch: patch });
          if(error) throw error;
          localSet(col, id, data || {});
        },
        async delete(){
          const { error } = await supabase.from(TABLE).delete().eq('collection', col).eq('id', id);
          if(error) throw error;
          if(caches[col]){ caches[col].delete(id); emit(col); }
        },
      };
    },
  };

  await importPrototypeOnce(supabase);

  // "Salir" del todo (cerrar sesión de Supabase) desde la consola: window.sofassLogout()
  window.sofassLogout = async () => { await supabase.auth.signOut(); location.href = '/login'; };

  return { db };
}

start().then(ctx => window.__sofassResolve(ctx)).catch(e => {
  console.error('No se pudo conectar con Supabase', e);
  window.__sofassReject(e);
});

    up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V6M6 12l6-6 6 6"/></svg>`,
    bookmark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>`,
    scan: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3M4 12h16"/></svg>`,
  };
  const icon = (name, cls) => `<span class="${cls||'icon'}" style="display:inline-flex;width:16px;height:16px;">${ICONS[name]||''}</span>`;

  /* ---------------- state ---------------- */
  const state = {
    role:null, sellerId:null,
    adminTab:'almacen',          // almacen | caja | ventas | movimientos | config
    configTab:'account',            // dash | stores | warehouses | suppliers | sellers | families
    stockView:'product',
    adminItemSearch:'', familyFilter:'', supplierFilter:'', warehouseFilter:'',
    sellerTab:'catalog', search:'',
    movFilter:'todos',
    cajaStoreId:null, cajaFrom:'', cajaTo:'', cajaSearch:'',
    ventasStoreId:null, ventasFrom:'', ventasTo:'', ventasSearch:'',
    modal:null, saleDraftItems:[], ventasView:'ventas', movActionsOpen:false, entitiesType:'stores',
    data:{ stores:[], warehouses:[], sellers:[], suppliers:[], families:[], familyGroups:[], settings:[], items:[], movements:[], sales:[], cash:[] },
  };

  let db = null;
  let canWrite = null; // null = desconocido todavía, true/false = respuesta de la plataforma
  const COLLECTIONS = ['stores','warehouses','sellers','suppliers','families','familyGroups','settings','items','movements','sales','cash'];

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>t.classList.remove('show'), 2400);
  }

  async function initDb(){
    try{ db = await claude.use('db'); }catch(e){ db = null; }
    if(!db){ render(); return; }
    COLLECTIONS.forEach(name=>{
      db.collection(name).onSnapshot(
        snap=>{ state.data[name] = snap.docs.map(d=>({id:d.id, ...(d.data()||{})})); render(); },
        err=>{ console.error('db error', name, err); }
      );
    });
  }
  async function initUser(){
    try{
      const user = await claude.use('user');
      if(!user){ return; }
      const ok = await user.can('data.write');
      if(ok===false){ canWrite = false; render(); }
      else if(ok===true){ canWrite = true; }
    }catch(e){ /* no sabemos: no mostramos nada */ }
  }
  function saveErrorMessage(verb){
    if(canWrite===false) return 'No tienes permiso para '+verb+' aquí (cuenta de solo lectura). Pide a Alfonso que te añada a su organización de Claude.';
    return 'No se pudo '+verb+'. Comprueba tu conexión e inténtalo de nuevo.';
  }
  async function addDoc(name, data){
    if(!db){ showToast('Almacenamiento no disponible en esta vista.'); return null; }
    try{
      const payload = {...data, createdAt: Date.now()};
      const ref = await db.collection(name).add(payload);
      // Actualización optimista: no esperamos a que vuelva la sincronización (onSnapshot)
      // para que la persona que acaba de guardar vea su propio cambio al instante.
      if(!Array.isArray(state.data[name])) state.data[name] = [];
      if(!state.data[name].some(d=>d.id===ref.id)) state.data[name] = [...state.data[name], {id:ref.id, ...payload}];
      render();
      return ref.id;
    }
    catch(e){ showToast(saveErrorMessage('guardar')); console.error(e); return null; }
  }
  async function updateDoc(name, id, data){
    if(!db){ showToast('Almacenamiento no disponible en esta vista.'); return false; }
    try{
      await db.doc(name+'/'+id).update(data);
      if(Array.isArray(state.data[name])){
        state.data[name] = state.data[name].map(d=> d.id===id ? {...d, ...data} : d);
        render();
      }
      return true;
    }
    catch(e){ showToast(saveErrorMessage('actualizar')); console.error(e); return false; }
  }
  async function deleteDocById(name, id){
    if(!db){ showToast('Almacenamiento no disponible en esta vista.'); return false; }
    try{
      await db.doc(name+'/'+id).delete();
      if(Array.isArray(state.data[name])){
        state.data[name] = state.data[name].filter(d=>d.id!==id);
        render();
      }
      return true;
    }
    catch(e){ showToast(saveErrorMessage('eliminar')); console.error(e); return false; }
  }

  async function setDoc(path, data){
    if(!db){ showToast('Almacenamiento no disponible en esta vista.'); return false; }
    try{ await db.doc(path).set({...data, updatedAt: Date.now()}); return true; }
    catch(e){ showToast(saveErrorMessage('guardar')); console.error(e); return false; }
  }
  const byId = (arr,id) => arr.find(x=>x.id===id);
  const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
  const warehouseName = id => (byId(state.data.warehouses,id)||{}).name || '—';
  const storeName = id => (byId(state.data.stores,id)||{}).name || '—';
  const supplierName = id => (byId(state.data.suppliers,id)||{}).name || '—';
  const familyName = id => (byId(state.data.families,id)||{}).name || '—';
  const groupName = id => (byId(state.data.familyGroups,id)||{}).name || '—';
  const getSettings = () => state.data.settings.find(s=>s.id==='app') || {};
  // Disponible = todos los almacenes menos "Vendido" (lo vendido pendiente de entregar ya no está a la venta).
  const totalStock = item => { const v = vendidoWarehouse(); return Object.entries(item.stock||{}).reduce((a,[wh,n])=>a+(v&&wh===v.id?0:(Number(n)||0)),0); };
  const stockIn = (item,whId) => Number((item.stock||{})[whId]||0);
  const fmtDate = ts => { if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('sv-SE'); };
  const fmtDateTime = ts => { if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('sv-SE')+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };
  function nextPedido(){
    const n = state.data.movements.filter(m=>m.type==='reserva').length + 1001;
    return 'PED-'+n;
  }
  function groupByDay(list){
    const groups = {};
    list.forEach(x=>{ const d=fmtDate(x.createdAt); (groups[d]=groups[d]||[]).push(x); });
    return Object.keys(groups).sort().reverse().map(d=>({date:d, items:groups[d]}));
  }

  /* ---------------- root render ---------------- */
  function render(){
    const app = document.getElementById('app');
    const warnBanner = canWrite===false ? `
      <div style="background:#fdecea;color:#8a1c1c;border-bottom:1px solid #f3b8b8;padding:10px 16px;font-size:.82rem;text-align:center;">
        ⚠️ Esta cuenta no tiene permiso para guardar cambios aquí (solo puede ver). Para poder registrar ventas, caja o stock,
        Alfonso tiene que añadirte a su misma organización de Claude, no solo compartir el enlace como editor.
      </div>` : '';
    if(state.role === null) app.innerHTML = warnBanner + renderGate();
    else if(state.role === 'admin') app.innerHTML = warnBanner + renderAdminShell();
    else app.innerHTML = warnBanner + renderSellerShell();
    if(state.modal) renderModal();
    wireEvents();
  }

  function renderGate(){
    return `
    <div class="gate">
      <img src="${LOGO_MARK}" alt="" class="gate-watermark">

  }

  function topbar(whoLabel){
    return `<div class="topbar">
      <div class="brand"><img src="${LOGO_ICON}" alt="" class="brand-mark">Sofass</div>

  /* ================= ADMIN ================= */
  const ADMIN_TABS = [
    {id:'almacen', label:'Almacén', icon:'warehouse'},
    {id:'valoracion', label:'Valoración', icon:'dash'},
    {id:'config', label:'Configuración', icon:'config'},
  ];
  function renderAdminShell(){
    return topbar(`<span class="who">${icon('admin')}<b>Administrador</b></span>`) + `
      <div class="maintabs">
        ${ADMIN_TABS.map(t=>`<button class="${state.adminTab===t.id?'active':''}" data-action="admin-tab" data-tab="${t.id}" type="button">${icon(t.icon)}${t.label}</button>`).join('')}
      </div>
      <div class="main">${renderAdminMain()}</div>`;
  }
  function renderAdminMain(){
    switch(state.adminTab){
      case 'almacen': return renderStockSection('admin');
      case 'ventas': return renderVentasShell();
      case 'valoracion': return renderValoracionSection();
      case 'config': return renderConfigSection();
      default: return '';
    }
  }

  /* ---- Almacén (shared by admin & seller catalog) ---- */
  function filteredItems(){
    let rows = state.data.items.slice();
    const q = (state.stockContext==='seller' ? state.search : state.adminItemSearch).trim().toLowerCase();
    if(q) rows = rows.filter(r=>(r.name||'').toLowerCase().includes(q) || (r.sku||'').toLowerCase().includes(q) || supplierName(r.supplierId).toLowerCase().includes(q) || (r.measure||'').toLowerCase().includes(q));
    if(state.familyFilter) rows = rows.filter(r=>r.familyId===state.familyFilter);
    if(state.supplierFilter) rows = rows.filter(r=>r.supplierId===state.supplierFilter);
    if(state.warehouseFilter) rows = rows.filter(r=>stockIn(r,state.warehouseFilter) > 0);
    return rows;
  }

  function renderStockSection(context){
    state.stockContext = context;
    const isAdmin = context==='admin';
    const view = state.stockView || 'product';
    if(isAdmin && view==='movimientos'){
      return `
      <div class="section-head">
        <div><h2>Almacén</h2><p>Consulta el stock por producto o dividido por almacén.</p></div>
      </div>
      <div class="subnav">
        <button class="${view==='product'?'active':''}" data-action="stock-view" data-view="product" type="button">Por producto</button>
        <button class="${view==='warehouse'?'active':''}" data-action="stock-view" data-view="warehouse" type="button">Por almacén</button>
        <button class="active" data-action="stock-view" data-view="movimientos" type="button">Movimientos</button>
      </div>
      ${renderMovimientosSection('Administrador', null, true)}
      `;
    }
    return `
    <div class="section-head">
      <div><h2>Almacén</h2><p>${isAdmin?'Consulta el stock por producto o dividido por almacén.':'Stock disponible en todas las tiendas.'}</p></div>
    </div>
    <div class="subnav">
      <button class="${view==='product'?'active':''}" data-action="stock-view" data-view="product" type="button">Por producto</button>
      <button class="${view==='warehouse'?'active':''}" data-action="stock-view" data-view="warehouse" type="button">Por almacén</button>
      ${isAdmin ? `<button class="${view==='movimientos'?'active':''}" data-action="stock-view" data-view="movimientos" type="button">Movimientos</button>` : ''}
    </div>
    <div class="toolbar">
      <input type="text" id="${isAdmin?'admin-item-search':'search-input'}" placeholder="Buscar por modelo, medida, proveedor o SKU…" value="${esc(isAdmin?state.adminItemSearch:state.search)}">
    </div>
    <div class="filter-row">
      <select id="family-filter"><option value="">Todas las familias</option>${state.data.families.map(f=>`<option value="${f.id}" ${state.familyFilter===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      <select id="supplier-filter"><option value="">Todos los proveedores</option>${state.data.suppliers.map(s=>`<option value="${s.id}" ${state.supplierFilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      ${view==='warehouse' ? `<select id="warehouse-filter"><option value="">Todos los almacenes</option>${state.data.warehouses.map(w=>`<option value="${w.id}" ${state.warehouseFilter===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>` : ''}
      ${isAdmin ? `<button class="btn btn-accent" data-action="open-add" data-entity="items" type="button">${icon('plus')} Artículo</button>` : ''}
    </div>
    ${renderItemCards(filteredItems(), isAdmin)}
    `;
  }

  function renderItemCards(rows, isAdmin){
    if(rows.length===0) return `<div class="empty">No se han encontrado artículos.</div>`;
    return rows.map(r=>{
      const total = totalStock(r);
      const locs = Object.keys(r.stock||{}).filter(whId=>Number(r.stock[whId])>0);
      const recent = state.data.movements.filter(m=>m.itemId===r.id && m.status!=='cancelado').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,2);
      return `
      <div class="item-card">
        <div class="head">
          <div>
            <h4>${esc(familyName(r.familyId))} · ${esc(r.name)}<span class="sku">${esc(r.sku||'')}</span></h4>
            <div class="meta">${esc(supplierName(r.supplierId))}${r.measure?` · ${esc(r.measure)}`:''}${r.material?` · ${esc(r.material)}`:''}</div>
          </div>
          <div class="total"><div class="n">${total}</div><div class="l">disponibles</div></div>
        </div>
        ${locs.length ? `<ul class="locs">${locs.map(whId=>`<li>${icon('warehouse')} ${esc(warehouseName(whId))} <b>${r.stock[whId]}</b></li>`).join('')}</ul>` : `<div class="locs" style="border-top:1px dashed var(--border);padding-top:9px;color:var(--ink-soft);font-size:.82rem;">Sin stock en ningún almacén.</div>`}
        ${recent.length ? `<div class="log-mini">${recent.map(m=>`<div><span>${m.type==='reserva'?('Pedido '+m.pedidoId+' · '+esc(m.storeName||'')):m.type==='vendido'?('Vendido · '+esc(m.storeName||m.warehouseName||'')):(m.type==='exposicion'?('Exposición · '+esc(m.storeName||'')):(m.subtype==='cliente'?('Entrada cliente · '+esc(m.clientName||'')):('Entrada · '+esc(m.warehouseName||''))))}</span><span>${m.qty} uds.</span></div>`).join('')}</div>` : ''}
        <div class="actions">
          ${isAdmin?`<button class="btn btn-teal" data-action="reserve" data-id="${r.id}" type="button" ${total<=0?'disabled':''}>${icon('bookmark')} Reservar</button>`:''}
          <button class="btn btn-navy" data-action="expose" data-id="${r.id}" type="button" ${total<=0?'disabled':''}>${icon('store')} Exposición</button>
          <button class="btn btn-accent" data-action="mark-sold" data-id="${r.id}" type="button" ${total<=0?'disabled':''}>${icon('sales')} Vendido</button>
          ${isAdmin?`<button class="btn btn-ghost btn-sm" data-action="open-edit" data-entity="items" data-id="${r.id}" type="button">${icon('edit')}</button>`:''}
        </div>
      </div>`;
    }).join('');
  }

  /* ---- Caja ---- */
  function storeLedger(storeId){
    const entries = [];
    state.data.cash.filter(c=>c.storeId===storeId).forEach(c=>{
      entries.push({ts:c.createdAt, label:c.type==='apertura'?('Apertura de caja'+(c.note?' · '+c.note:'')):('Retirada'+(c.note?' · '+c.note:'')), amount: c.type==='apertura'?Number(c.amount):-Number(c.amount), who:'Administrador', method:''});
    });
    state.data.sales.filter(s=>s.storeId===storeId && s.status==='cobrada').forEach(s=>{
      entries.push({ts:s.createdAt, label:esc(s.clientName||'Cliente')+(s.pedidoNumber?(' · Pedido '+s.pedidoNumber):''), amount:Number(s.total)||0, who:s.sellerName||'Administrador', method:s.method||''});
    });
    entries.sort((a,b)=>(a.ts||0)-(b.ts||0));
    let running = 0;
    entries.forEach(e=>{ e.before=running; running += e.amount; e.after=running; });
    return {entries, balance:running};
  }
  /* ---- Ventas shell (Ventas + Caja, agrupadas) ---- */
  function renderVentasShell(lockStoreId){
    const view = state.ventasView || 'ventas';
    return `
    <div class="subnav">
      <button class="${view==='ventas'?'active':''}" data-action="ventas-view" data-view="ventas" type="button">Ventas</button>
      <button class="${view==='caja'?'active':''}" data-action="ventas-view" data-view="caja" type="button">Caja</button>
    </div>
    ${view==='caja' ? renderCajaSection(lockStoreId) : renderVentasSection(lockStoreId)}
    `;
  }
  function renderCajaSection(lockStoreId){
    const stores = state.data.stores;
    if(stores.length===0) return `<div class="section-head"><div><h2>Caja</h2><p>Saldo por tienda.</p></div></div><div class="empty">Añade una tienda en Configuración para empezar a usar la caja.</div>`;
    const activeId = lockStoreId || state.cajaStoreId || stores[0].id;
    if(!lockStoreId && !state.cajaStoreId) state.cajaStoreId = activeId;
    const store = byId(stores, activeId);
    const {entries, balance} = storeLedger(activeId);
    let filtered = entries.slice();
    if(state.cajaFrom) filtered = filtered.filter(e=>fmtDate(e.ts) >= state.cajaFrom);
    if(state.cajaTo) filtered = filtered.filter(e=>fmtDate(e.ts) <= state.cajaTo);
    if(state.cajaSearch.trim()){ const q=state.cajaSearch.trim().toLowerCase(); filtered = filtered.filter(e=>e.label.toLowerCase().includes(q) || e.who.toLowerCase().includes(q)); }
    const days = groupByDay(filtered.slice().reverse());
    return `
    <div class="section-head"><div><h2>Caja</h2><p>Saldo y movimientos de caja por tienda.</p></div></div>
    ${lockStoreId ? '' : `<div class="filter-row">
      <select id="caja-store"><option value="">— elige tienda —</option>${stores.map(s=>`<option value="${s.id}" ${activeId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    </div>`}
    <div class="cash-card">
      <div class="top"><h3>${esc(store?store.name:'—')}</h3><div class="n">${money(balance)}</div></div>
      <div class="balance-label">Saldo actual de caja</div>
      <div class="balance-n">${money(balance)}</div>
      <div class="cash-actions">
        <button class="add" data-action="cash-move" data-type="apertura" data-store="${activeId}" type="button">${icon('down')} Apertura</button>
        <button class="sub" data-action="cash-move" data-type="retirada" data-store="${activeId}" type="button">${icon('up')} Retirada</button>

      <div class="filter-row" style="margin-bottom:0;">

      <div class="toolbar" style="margin-top:10px;margin-bottom:0;">
        <input type="text" id="caja-search" placeholder="Vendedor, cliente o pedido…" value="${esc(state.cajaSearch)}">
      </div>
    </div>
    ${days.length===0 ? `<div class="empty">No hay movimientos de caja todavía.</div>` : days.map(day=>{
      const first = day.items[0];
      const last = day.items[day.items.length-1];

      <div class="day-head"><h3>${day.date}</h3><span>Día anterior: ${money(first.before)}</span></div>
      <div class="card">
        ${day.items.map(e=>`<div class="hist-item" style="border:none;padding:8px 0;margin:0;"><div class="top"><div class="name">${e.who}${e.method?' · '+e.method:''}</div><div class="money">${e.amount>=0?'':'−'}${money(Math.abs(e.amount))}</div></div><div class="sub">${e.label}</div></div>`).join('<div style="border-top:1px dashed var(--border);"></div>')}
        <div style="border-top:1px dashed var(--border);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:.82rem;"><span>Saldo existente</span><b>${money(last.after)}</b></div>
      </div>`;

  /* ---- Ventas ---- */
  function renderVentasSection(lockStoreId){
    const stores = state.data.stores;
    if(stores.length===0) return `<div class="section-head"><div><h2>Ventas</h2></div></div><div class="empty">Añade una tienda en Configuración para registrar ventas.</div>`;
    const activeId = lockStoreId || state.ventasStoreId || stores[0].id;
    if(!lockStoreId && !state.ventasStoreId) state.ventasStoreId = activeId;
    let rows = state.data.sales.filter(s=>s.storeId===activeId);
    if(state.ventasFrom) rows = rows.filter(s=>fmtDate(s.createdAt) >= state.ventasFrom);
    if(state.ventasTo) rows = rows.filter(s=>fmtDate(s.createdAt) <= state.ventasTo);
    if(state.ventasSearch.trim()){ const q=state.ventasSearch.trim().toLowerCase(); rows = rows.filter(s=>(s.clientName||'').toLowerCase().includes(q) || (s.pedidoNumber||'').toLowerCase().includes(q)); }
    const days = groupByDay(rows.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
    return `
    <div class="section-head"><div><h2>Ventas</h2><p>Registro de ventas por tienda.</p></div></div>
    ${lockStoreId ? '' : `<div class="filter-row">
      <select id="ventas-store">${stores.map(s=>`<option value="${s.id}" ${activeId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    </div>`}
    <button class="btn btn-teal btn-block" data-action="open-sale" data-store="${activeId}" type="button">${icon('cash')} Registrar venta</button>
    <div class="filter-row" style="margin-top:14px;">
      <input type="date" id="ventas-from" value="${state.ventasFrom}">
      <input type="date" id="ventas-to" value="${state.ventasTo}">
    </div>
    <div class="toolbar">
      <input type="text" id="ventas-search" placeholder="Número de pedido o cliente…" value="${esc(state.ventasSearch)}">
    </div>
    ${days.length===0 ? `<div class="empty">Todavía no hay ventas registradas en esta tienda.</div>` : days.map(day=>`
      <div class="day-head"><h3>${day.date}</h3><span>${day.items.length} venta${day.items.length===1?'':'s'}</span></div>
      ${day.items.map(s=>{
        const lines = s.items||[];
        const pending = lines.filter(l=>!l.delivered);
        return `
        <div class="sale-card">
          <div class="top"><div class="client">${esc(s.clientName||'Cliente')}${s.pedidoNumber?` <span class="pedido">· Pedido ${esc(s.pedidoNumber)}</span>`:''}</div><div class="total">${money(s.total)}</div></div>
          <div class="sub">${fmtDateTime(s.createdAt)} · ${esc(s.sellerName||'Administrador')}</div>
          ${s.itemsText ? `<div class="items">${esc(s.itemsText)}</div>` : ''}
          ${lines.length ? `<ul class="locs" style="margin-top:8px;">${lines.map((l,li)=>{
            const fab = (!l.itemId && l.supplierName) ? ` <span style="color:var(--ink-soft);">· Fabricante: ${esc(l.supplierName)}</span>` : '';
            const origen = (l.delivered && l.sourceWarehouses && l.sourceWarehouses.length) ? ` <span style="color:var(--ink-soft);">· Procedía de: ${l.sourceWarehouses.map(sw=>esc(sw.warehouseName)).join(', ')}</span>` : '';
            const needsHandOver = l.orderType==='stock' && l.delivered && l.handedOver===false;
            const entregadoBtn = needsHandOver ? ` <button type="button" class="btn btn-accent btn-sm" style="margin-left:auto;" data-action="hand-over-line" data-id="${s.id}" data-idx="${li}">✓ Entregado</button>` : '';
            return `<li>${l.delivered?(needsHandOver?'📦':'✓'):(l.orderType==='pedido'?'📋':'⏳')} ${esc(l.itemName)} <b>x${l.qty}</b>${fab}${origen}${l.note?` <span style="color:var(--ink-soft);">(${esc(l.note)})</span>`:''}${entregadoBtn}</li>`;
          }).join('')}</ul>` : ''}
          <div class="foot">
            ${s.deposit ? `<span>Seña: <b>${money(s.deposit)}</b> (${esc(s.method||'—')})</span>` : `<span>${esc(s.method||'—')}</span>`}
            <span class="status-pill status-${s.status}">${s.status==='cobrada'?'cobrada':'pendiente'}</span>
            ${pending.length ? `<span class="status-pill status-pendiente">${pending.length} pendiente${pending.length===1?'':'s'}</span><button class="btn btn-ghost btn-sm" data-action="download-order-sheet" data-id="${s.id}" type="button">${icon('down')} Hoja de pedido</button>` : ''}
          </div>
        </div>`;
      }).join('')}
    `).join('')}
    `;
  }

  /* ---- Movimientos ---- */
  function renderMovimientosSection(actorName, sellerId, isAdmin){
    let rows = state.data.movements.slice();
    if(sellerId) rows = rows.filter(m=>m.sellerId===sellerId);
    if(state.movFilter!=='todos') rows = rows.filter(m=>m.type===state.movFilter);
    rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return `
    <div class="section-head"><div><h2>Movimientos</h2><p>${isAdmin?'Entradas, reservas, exposición y vendidos.':'Peticiones de exposición y entradas asignadas a tus ventas.'}</p></div></div>
    ${isAdmin ? `
      <div class="action-row">
        <button class="btn btn-accent btn-block" data-action="toggle-mov-actions" type="button">${icon('plus')} Nueva acción</button>
      </div>
      ${state.movActionsOpen ? `
        <div class="action-row">
          <button class="btn btn-accent" data-action="open-movement" data-type="entrada" type="button">${icon('down')} Registrar entrada</button>
          <button class="btn btn-teal" data-action="open-movement" data-type="reserva" type="button">${icon('bookmark')} Reservar para pedido</button>
        </div>
        <div class="action-row"><button class="btn btn-navy btn-block" data-action="open-movement" data-type="exposicion" type="button">${icon('store')} Pedir para exposición</button></div>
        <div class="action-row"><button class="btn btn-accent btn-block" data-action="open-movement" data-type="vendido" type="button">${icon('sales')} Marcar como vendido</button></div>
        <div class="action-row"><button class="btn btn-teal btn-block" data-action="open-import" type="button">${icon('down')} Importar albarán</button></div>
      ` : ''}
    ` : `
      <div class="action-row"><button class="btn btn-navy btn-block" data-action="open-movement" data-type="exposicion" type="button">${icon('store')} Pedir para exposición</button></div>
    `}
    <div class="eyebrow" style="margin-top:8px;">Historial</div>
    <div class="subnav">
      ${[['todos','Todos'],['entrada','Entrada'],['reserva','Reserva'],['exposicion','Exposición'],['vendido','Vendido']].map(([id,label])=>`<button class="${state.movFilter===id?'active':''}" data-action="mov-filter" data-filter="${id}" type="button">${label}</button>`).join('')}
    </div>
    ${rows.length===0 ? `<div class="empty">No hay movimientos todavía.</div>` : rows.map(m=>renderMovementItem(m)).join('')}
    `;
  }
  function renderMovementItem(m){
    let sub = '';
    if(m.type==='entrada' && m.subtype==='cliente'){
      sub = `Entrada cliente · ${esc(m.clientName||'—')} · ${esc(m.storeName||'')}${m.pedidoNumber?(' · Pedido '+esc(m.pedidoNumber)):''} · REF:${esc(m.sku||'—')}<br><span class="money">${money(m.unitPrice)}/ud · Total ${money(m.total)}</span>`;
    } else if(m.type==='entrada'){
      sub = `Entrada · ${esc(m.actorName||'Administrador')} · ${esc(m.warehouseName||'')} · REF:${esc(m.sku||'—')}<br><span class="money">${money(m.unitPrice)}/ud · Total ${money(m.total)}</span>`;
    } else if(m.type==='reserva'){
      sub = `Pedido ${esc(m.pedidoId||'')} · Cliente: ${esc(m.clientName||'—')} · ${esc(m.actorName||'')} · ${esc(m.storeName||m.warehouseName||'')}`;
    } else if(m.type==='vendido'){
      sub = `Vendido · ${esc(m.actorName||'')} · ${esc(m.storeName||m.warehouseName||'')}${m.clientName?` · ${esc(m.clientName)}`:''} · Salió de ${esc(m.warehouseName||'—')}`;
    } else {
      sub = `Exposición · ${esc(m.actorName||'')} · ${esc(m.storeName||m.warehouseName||'')}`;
    }
    const canCancel = (m.type==='reserva' || m.type==='exposicion' || m.type==='vendido') && m.status!=='cancelado' && !!m.warehouseId;
    return `
    <div class="hist-item">
      <div class="top">
        <div><div class="name">${icon(m.type==='entrada'?'down':m.type==='reserva'?'bookmark':m.type==='vendido'?'sales':'store')} ${esc(m.itemName)} <span class="qty">x${m.qty}</span></div></div>
        <div class="date">${fmtDate(m.createdAt)}</div>
      </div>
      <div class="sub">${sub}</div>
      <div class="foot">
        <span>${m.status==='cancelado' ? '<span class="status-pill status-cancelado">cancelado</span>' : (m.type!=='entrada' ? '<span class="trace-link">Trazabilidad · quedan '+totalStockNote(m)+'</span>' : '<span class="trace-link">Trazabilidad</span>')}</span>
        ${canCancel ? `<button class="cancel-link" data-action="cancel-movement" data-id="${m.id}" type="button">cancelar</button>` : ''}
      </div>
    </div>`;
  }
  function totalStockNote(m){
    const item = byId(state.data.items, m.itemId);
    return item ? (totalStock(item)+' de stock') : '—';
  }

  /* ---- Valoración ---- */
  function renderValoracionSection(){
    state.valorView = state.valorView || 'warehouse';
    const items = state.data.items;
    let totalUnits = 0, totalValue = 0, noPriceUnits = 0;
    items.forEach(i=>{
      const t = totalStock(i);
      totalUnits += t;
      if(Number(i.price)>0) totalValue += t*Number(i.price);
      else noPriceUnits += t;
    });
    const groups = {};
    function addTo(key,label,qty,value){
      if(!groups[key]) groups[key]={label,qty:0,value:0};
      groups[key].qty+=qty; groups[key].value+=value;
    }
    if(state.valorView==='warehouse'){
      const vendV = vendidoWarehouse();
      items.forEach(i=>{ Object.keys(i.stock||{}).forEach(whId=>{ if(vendV && whId===vendV.id) return; const q=Number(i.stock[whId])||0; if(q>0) addTo(whId, warehouseName(whId), q, q*(Number(i.price)||0)); }); });
    } else if(state.valorView==='supplier'){
      items.forEach(i=>{ const q=totalStock(i); if(q>0) addTo(i.supplierId||'—', supplierName(i.supplierId), q, q*(Number(i.price)||0)); });
    } else {
      items.forEach(i=>{ const q=totalStock(i); if(q>0) addTo(i.familyId||'—', familyName(i.familyId), q, q*(Number(i.price)||0)); });
    }
    const groupKeys = Object.keys(groups).sort((a,b)=>groups[b].value-groups[a].value);
    return `
    <div class="section-head"><div><h2>Valoración</h2><p>Inventario valorado al precio configurado de cada artículo.</p></div></div>
    <div class="cash-card">
      <div class="eyebrow">Inventario valorado</div>
      <div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;">
        <div><div class="balance-label">Unidades en stock</div><div class="balance-n" style="margin-bottom:0;">${totalUnits}</div></div>
        <div style="text-align:right;"><div class="balance-label">Valor total</div><div class="balance-n" style="margin-bottom:0;color:var(--accent-2);">${money(totalValue)}</div></div>
      </div>
      ${noPriceUnits>0 ? `<div style="margin-top:10px;color:var(--danger);font-size:.82rem;">${noPriceUnits} unidades sin coste registrado (no incluidas en el valor total).</div>` : ''}
    </div>
    ${(()=>{
      const sinCoste = items.filter(i=>!(Number(i.price)>0) && totalStock(i)>0);
      if(!sinCoste.length) return '';
      return `
      <div class="wh-block">
        <div class="wh-block-head"><h3>Pendientes de coste</h3><span class="tag low">${sinCoste.length}</span></div>
        <p style="margin:0 0 10px;color:var(--ink-soft);font-size:.84rem;">Escribe el coste por unidad y pulsa fuera del recuadro (o Intro) para guardarlo.</p>
        <div class="table-wrap"><table><thead><tr><th>Artículo</th><th>Uds.</th><th>€/ud</th></tr></thead><tbody>
          ${sinCoste.map(i=>`<tr><td>${esc(familyName(i.familyId))} · ${esc(i.name)}<div style="font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);">${esc(i.sku||'')}</div></td><td>${totalStock(i)}</td><td><input class="price-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" data-price-item="${i.id}"></td></tr>`).join('')}
        </tbody></table></div>
      </div>`;
    })()}
    <div class="subnav">
      <button class="${state.valorView==='warehouse'?'active':''}" data-action="valor-view" data-view="warehouse" type="button">Por almacén</button>
      <button class="${state.valorView==='supplier'?'active':''}" data-action="valor-view" data-view="supplier" type="button">Por proveedor</button>
      <button class="${state.valorView==='family'?'active':''}" data-action="valor-view" data-view="family" type="button">Por familia</button>
    </div>
    ${groupKeys.length===0 ? `<div class="empty">No hay stock valorado todavía.</div>` : groupKeys.map(k=>{
      const g = groups[k];
      const rows = items.filter(i=>{
        if(state.valorView==='warehouse') return stockIn(i,k)>0;
        if(state.valorView==='supplier') return (i.supplierId||'—')===k && totalStock(i)>0;
        return (i.familyId||'—')===k && totalStock(i)>0;
      });
      return `
      <div class="wh-block">
        <div class="wh-block-head"><h3>${esc(g.label)}</h3><span class="tag">${g.qty} ud.</span><span style="margin-left:auto;font-weight:700;color:var(--accent-2);">${money(g.value)}</span></div>
        <div class="table-wrap"><table><thead><tr><th>Artículo</th><th>Uds.</th><th>€/ud</th><th>Valor</th></tr></thead><tbody>
          ${rows.map(i=>{ const q = state.valorView==='warehouse'?stockIn(i,k):totalStock(i); return `<tr><td>${esc(familyName(i.familyId))} · ${esc(i.name)}<div style="font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);">${esc(i.sku||'—')}</div></td><td>${q}</td><td><input class="price-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${Number(i.price)>0?String(Number(i.price)).replace('.',','):''}" data-price-item="${i.id}"></td><td>${Number(i.price)>0?money(q*i.price):'<span class="tag low">sin coste</span>'}</td></tr>`; }).join('')}
        </tbody></table></div>
      </div>`;
    }).join('')}
    `;
  }

  /* ---- Configuración ---- */
  const CONFIG_TABS = [
    {id:'account', label:'Mi cuenta'},
    {id:'dash', label:'Resumen'},
    {id:'entities', label:'Tiendas y almacenes'},
    {id:'sellers', label:'Vendedores'},
    {id:'suppliers', label:'Proveedores'},
  ];
  const ENTITY_TYPES = [
    {id:'stores', label:'Tiendas', title:'Tiendas', hint:'Puntos de venta donde trabajan tus vendedores.', cols:[{key:'name',label:'Nombre'},{key:'address',label:'Dirección'}]},
    {id:'warehouses', label:'Almacenes', title:'Almacenes', hint:'Los almacenes guardan el stock físico de cada artículo.', cols:[{key:'name',label:'Nombre'},{key:'location',label:'Ubicación'}]},
  ];
  function renderEntitiesConfig(){
    const type = state.entitiesType || 'stores';
    const t = ENTITY_TYPES.find(x=>x.id===type) || ENTITY_TYPES[0];
    return `
    <div class="config-tabs">
      ${ENTITY_TYPES.map(x=>`<button class="${type===x.id?'active':''}" data-action="entities-type" data-type="${x.id}" type="button">${x.label}</button>`).join('')}
    </div>
    ${renderEntityTable(t.id, t.title, t.hint, t.cols)}
    `;
  }
  function renderConfigSection(){
    return `
    <div class="section-head"><div><h2>Configuración</h2><p>Tiendas, almacenes, vendedores y proveedores.</p></div></div>
    <div class="config-tabs">
      ${CONFIG_TABS.map(t=>`<button class="${state.configTab===t.id?'active':''}" data-action="config-tab" data-tab="${t.id}" type="button">${t.label}</button>`).join('')}
    </div>
    ${renderConfigMain()}
    `;
  }
  function renderConfigMain(){
    switch(state.configTab){
      case 'account': return renderAccountSection();
      case 'dash': return renderDash();
      case 'suppliers': return renderSuppliersConfig();
      case 'entities': return renderEntitiesConfig();
      case 'sellers': return renderSellersTable();
      default: return '';
    }
  }
  function renderSuppliersConfig(){
    const rows = state.data.suppliers;
    const cell = (r, key, type, ph) => `<input class="sup-input" type="${type}" ${type==='text'&&key==='pvpPoints'?'inputmode="decimal"':''} data-sup-id="${r.id}" data-sup-key="${key}" value="${esc(key==='pvpPoints' && r[key]!=null && r[key]!=='' ? String(r[key]).replace('.',',') : (r[key]||''))}" placeholder="${ph}">`;
    return `
    <div class="section-head"><div><p>Fabricantes que suministran artículos. Toca cualquier campo para cambiarlo; se guarda al salir del recuadro. Déjalo vacío para borrarlo.</p></div></div>
    ${rows.length===0 ? `<div class="empty">Todavía no hay proveedores.</div>` : `
    <div class="table-wrap"><table class="sup-table"><thead><tr><th>Nº prov</th><th>Nombre</th><th>Familia</th><th>Puntos PVP</th><th>Fecha actualización</th><th>Datos proveedor</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td>${cell(r,'provNumber','text','Nº')}</td>
        <td><textarea class="sup-input sup-name sup-grow" rows="1" data-sup-id="${r.id}" data-sup-key="name" placeholder="Nombre">${esc(r.name||'')}</textarea></td>
        <td>${cell(r,'family','text','Familia')}</td>
        <td>${renderPvpCell(r)}</td>
        <td>${cell(r,'updatedOn','date','')}</td>
        <td><textarea class="sup-input sup-notes sup-grow" rows="2" data-sup-id="${r.id}" data-sup-key="supplierData" placeholder="Teléfono, email, dirección, contacto…">${esc(r.supplierData!=null ? r.supplierData : (r.contact||''))}</textarea></td>
        <td><button class="btn btn-ghost btn-sm btn-danger" data-action="delete" data-entity="suppliers" data-id="${r.id}" type="button" title="Eliminar proveedor">${icon('trash')}</button></td>
      </tr>`).join('')}
    </tbody></table></div>`}
    <div class="toolbar" style="margin-top:12px;">
      <input type="text" id="quick-suppliers" placeholder="Nuevo proveedor…">
      <button class="btn btn-accent" data-action="quick-add" data-entity="suppliers" type="button">${icon('plus')}</button>
    </div>
    `;
  }
  // Varios puntos PVP por proveedor: lista [{label, value}]. Si solo hay el dato antiguo (pvpPoints), se usa como primera casilla.
  function supplierPvpList(r){
    if(Array.isArray(r.pvpList)) return r.pvpList;
    return (r.pvpPoints!=null && r.pvpPoints!=='') ? [{label:'', value:r.pvpPoints}] : [{label:'', value:''}];
  }
  function renderPvpCell(r){
    const list = supplierPvpList(r);
    const fmt = v => (v===''||v==null) ? '' : String(v).replace('.',',');
    return `<div class="pvp-list">
      ${list.map((p,idx)=>`<div class="pvp-row">
        <input class="sup-input pvp-label" type="text" data-pvp-sup="${r.id}" data-pvp-idx="${idx}" data-pvp-field="label" value="${esc(p.label||'')}" placeholder="Concepto">
        <input class="sup-input pvp-value" type="text" inputmode="decimal" data-pvp-sup="${r.id}" data-pvp-idx="${idx}" data-pvp-field="value" value="${esc(fmt(p.value))}" placeholder="0,00">
        <button class="btn btn-ghost btn-sm btn-danger" data-action="pvp-remove" data-id="${r.id}" data-idx="${idx}" type="button" title="Quitar estos puntos">×</button>
      </div>`).join('')}
      <button class="btn btn-ghost btn-sm pvp-add" data-action="pvp-add" data-id="${r.id}" type="button">${icon('plus')} Añadir puntos</button>
    </div>`;
  }
  async function saveSupplierPvp(supId, list, touchDate){
    const clean = list.map(p=>({label:String(p.label||'').trim(), value:p.value}));
    const first = clean.find(p=>p.value!=='' && p.value!=null);
    const patch = {pvpList: clean, pvpPoints: first ? first.value : ''};
    // Al cambiar unos puntos, la fecha de actualización pasa a hoy (se puede cambiar a mano).
    if(touchDate) patch.updatedOn = new Date().toLocaleDateString('sv-SE');
    return updateDoc('suppliers', supId, patch);
  }
  function readPvpFromDom(supId){
    const list = [];
    document.querySelectorAll(`[data-pvp-sup="${supId}"]`).forEach(inp=>{
      const i = Number(inp.dataset.pvpIdx);
      list[i] = list[i] || {label:'', value:''};
      if(inp.dataset.pvpField==='label') list[i].label = inp.value;
      else {

    } else {

    fields.forEach(f=>{

      let v = el ? el.value : '';
      if(f.type==='number') v = v===''? 0 : Number(v);
      if(f.required && (v===''||v==null)) missing = true;
      data[f.key] = v;
    });
    if(missing){ showToast('Completa los campos obligatorios.'); return; }
    if(entity==='items' && mode==='add') data.stock = {};
    if(mode==='add'){
      const savedId = await addDoc(entity, data);
      if(!savedId) return;

  async function saveMovement(){
    const m = state.modal;
    if(m.type==='entrada' && (m.destino||'stock')==='cliente'){
      const sel = (document.querySelector('[data-field="pendingLine"]')||{}).value || '';
      if(!sel){ showToast('Elige la venta a la que pertenece.'); return; }
      const [saleId, lineIdxStr] = sel.split('|');
      const lineIdx = Number(lineIdxStr);
      const sale = byId(state.data.sales, saleId);
      if(!sale || !sale.items || !sale.items[lineIdx]){ showToast('No se encontró esa línea de venta.'); return; }
      const line = sale.items[lineIdx];
      const unitPrice = Number((document.querySelector('[data-field="unitPrice"]')||{}).value)||0;
      const seller = state.sellerId ? byId(state.data.sellers, state.sellerId) : null;
      const actorName = seller ? seller.name : 'Administrador';
      const movId = await addDoc('movements', {type:'entrada', subtype:'cliente', itemId:line.itemId, itemName:line.itemName, sku:line.sku||'', qty:line.qty, unitPrice, total:unitPrice*line.qty, clientName:sale.clientName, storeId:sale.storeId, storeName:sale.storeName, pedidoNumber:sale.pedidoNumber, actorName, status:'activo'});
      if(!movId) return;
      const newItems = sale.items.map((l,idx)=> idx===lineIdx ? {...l, delivered:true, deliveredAt:Date.now()} : l);
      const ok = await updateDoc('sales', sale.id, {items:newItems});
      if(!ok) return;
      showToast('Entrada asignada a la venta de '+(sale.clientName||'cliente')+'.');
      state.modal = null; render();
      return;
    }
    const itemIdEl = document.querySelector('[data-field="itemId"]');
    const itemId = m.itemId || (itemIdEl ? itemIdEl.value : '');
    const item = byId(state.data.items, itemId);
    if(!item){ showToast('Elige un artículo.'); return; }
    const warehouseId = (document.querySelector('[data-field="warehouseId"]')||{}).value;
    if(!warehouseId){ showToast('Elige un almacén.'); return; }
    const qty = Math.max(1, Number((document.querySelector('[data-field="qty"]')||{}).value)||1);
    const vendW = vendidoWarehouse();
    if(vendW && warehouseId===vendW.id){ showToast('Las unidades del almacén "Vendido" ya no están disponibles.'); return; }
    const available = stockIn(item, warehouseId);
    if(m.type!=='entrada' && qty>available){ showToast('No hay suficiente stock en ese almacén: quedan '+available+'.'); return; }
    const seller = state.sellerId ? byId(state.data.sellers, state.sellerId) : null;
    const actorName = seller ? seller.name : 'Administrador';
    const storeField = document.querySelector('[data-field="storeId"]');
    const storeId = storeField ? storeField.value : (seller?seller.storeId:'');
    const newStock = {...(item.stock||{})};
    if(m.type==='entrada'){
      const unitPrice = Number((document.querySelector('[data-field="unitPrice"]')||{}).value)||0;
      newStock[warehouseId] = (Number(newStock[warehouseId])||0) + qty;
      const ok = await updateDoc('items', item.id, {stock:newStock});
      if(!ok) return;
      const movId = await addDoc('movements', {type:'entrada', itemId:item.id, itemName:item.name, sku:item.sku||'', qty, warehouseId, warehouseName:warehouseName(warehouseId), unitPrice, total:unitPrice*qty, actorName, status:'activo'});
      if(!movId) return;
      showToast('Entrada registrada.');
    } else if(m.type==='reserva'){
      const clientName = (document.querySelector('[data-field="clientName"]')||{}).value || '';
      newStock[warehouseId] = Math.max(0,(Number(newStock[warehouseId])||0) - qty);
      const ok = await updateDoc('items', item.id, {stock:newStock});
      if(!ok) return;
      const movId = await addDoc('movements', {type:'reserva', itemId:item.id, itemName:item.name, sku:item.sku||'', qty, warehouseId, warehouseName:warehouseName(warehouseId), clientName, pedidoId:nextPedido(), sellerId:seller?seller.id:null, storeId:storeId||'', storeName:storeName(storeId), actorName, status:'activo'});
      if(!movId) return;
      showToast('Reserva enviada.');
    } else if(m.type==='vendido'){
      const clientName = (document.querySelector('[data-field="clientName"]')||{}).value || '';
      newStock[warehouseId] = Math.max(0,(Number(newStock[warehouseId])||0) - qty);
      if(vendW) newStock[vendW.id] = (Number(newStock[vendW.id])||0) + qty;
      const ok = await updateDoc('items', item.id, {stock:newStock});
      if(!ok) return;
      const movId = await addDoc('movements', {type:'vendido', itemId:item.id, itemName:item.name, sku:item.sku||'', qty, warehouseId, warehouseName:warehouseName(warehouseId), clientName, sellerId:seller?seller.id:null, storeId:storeId||'', storeName:storeId?storeName(storeId):'', actorName, status:'activo'});
      if(!movId) return;
      showToast('Marcado como vendido · ya no está disponible.');
    } else {
      newStock[warehouseId] = Math.max(0,(Number(newStock[warehouseId])||0) - qty);
      const ok = await updateDoc('items', item.id, {stock:newStock});
      if(!ok) return;
      const movId = await addDoc('movements', {type:'exposicion', itemId:item.id, itemName:item.name, sku:item.sku||'', qty, warehouseId, warehouseName:warehouseName(warehouseId), sellerId:seller?seller.id:null, storeId:storeId||'', storeName:storeName(storeId), actorName, status:'activo'});
      if(!movId) return;
      showToast('Exposición registrada · se ha descontado del almacén.');
    }
    state.modal = null; render();
  }
  async function cancelMovement(id){
    const m = byId(state.data.movements, id);
    if(!m) return;
    if(!m.warehouseId){ showToast('Esta reserva viene de una venta y no se puede cancelar aquí.'); return; }
    if(!window.confirm('¿Cancelar esto? El stock volverá al almacén.')) return;
    const item = byId(state.data.items, m.itemId);
    if(item){
      const newStock = {...(item.stock||{})};
      newStock[m.warehouseId] = (Number(newStock[m.warehouseId])||0) + Number(m.qty||0);
      const vendC = vendidoWarehouse();
      if(m.type==='vendido' && vendC) newStock[vendC.id] = Math.max(0,(Number(newStock[vendC.id])||0) - Number(m.qty||0));
      await updateDoc('items', item.id, {stock:newStock});
    }
    await updateDoc('movements', id, {status:'cancelado'});
    showToast(m.type==='exposicion' ? 'Exposición cancelada.' : m.type==='vendido' ? 'Venta anulada · vuelve a estar disponible.' : 'Reserva cancelada.');
  }

  const vendidoWarehouse = () => state.data.warehouses.find(w=>(w.name||'').trim().toLowerCase()==='vendido');
  async function deductStockAcrossWarehouses(item, qty){
    const vendido = vendidoWarehouse();
    const newStock = {...(item.stock||{})};
    let remaining = qty;
    const sources = [];
    for(const whId of Object.keys(newStock)){
      if(remaining<=0) break;
      if(vendido && whId===vendido.id) continue; // no restar del propio almacén "Vendido"
      const have = Number(newStock[whId])||0;
      const take = Math.min(have, remaining);
      if(take<=0) continue;
      newStock[whId] = have - take;
      remaining -= take;
      sources.push({warehouseId:whId, warehouseName:warehouseName(whId), qty:take});
    }
    const movedQty = qty - remaining;
    if(vendido && movedQty>0){
      newStock[vendido.id] = (Number(newStock[vendido.id])||0) + movedQty;
    }
    await updateDoc('items', item.id, {stock:newStock});
    return {sources, movedToVendido: !!(vendido && movedQty>0)};
  }
  async function handOverSaleLine(saleId, lineIdx){
    const sale = byId(state.data.sales, saleId);
    if(!sale || !sale.items || !sale.items[lineIdx]){ showToast('No se encontró esa línea.'); return; }
    const line = sale.items[lineIdx];
    const vendido = vendidoWarehouse();
    if(!vendido){ showToast('Crea un almacén llamado "Vendido" en Configuración para poder usar esto.'); return; }
    if(line.itemId){
      const item = byId(state.data.items, line.itemId);
      if(item){
        const newStock = {...(item.stock||{})};
        newStock[vendido.id] = Math.max(0, (Number(newStock[vendido.id])||0) - line.qty);
        await updateDoc('items', item.id, {stock:newStock});
      }
    }
    const newItems = sale.items.map((l,idx)=> idx===lineIdx ? {...l, handedOver:true, handedOverAt:Date.now()} : l);
    const ok = await updateDoc('sales', sale.id, {items:newItems});
    if(!ok) return;
    showToast('Marcado como entregado al cliente.');
    render();
  }
  async function saveSale(){
    const m = state.modal;
    const get = k => (document.querySelector(`[data-field="${k}"]`)||{}).value || '';
    const total = Number(get('total'))||0;
    if(total<=0){ showToast('Introduce un total.'); return; }
    const seller = state.sellerId ? byId(state.data.sellers, state.sellerId) : null;
    const clientName = get('clientName');
    const pedidoNumber = get('pedidoNumber');
    const drafts = (state.saleDraftItems || []).filter(l=>l.itemId);
    const pedidoPorArticulo = {};
    drafts.forEach(l=>{ pedidoPorArticulo[l.itemId] = (pedidoPorArticulo[l.itemId]||0) + l.qty; });
    for(const id of Object.keys(pedidoPorArticulo)){
      const it = byId(state.data.items, id);
      if(!it || pedidoPorArticulo[id] > totalStock(it)){ showToast('No hay stock suficiente de '+(it?it.name:'un artículo')+'.'); return; }
    }
    const finalItems = [];
    let lineSeq = 1;
    for(const l of drafts){
      if(!l.itemId){
        // producto nuevo (no está en el catálogo) — siempre queda como pedido al fabricante
        finalItems.push({id:'L'+(lineSeq++), itemId:null, itemName:l.itemName, sku:'', qty:l.qty, orderType:'pedido', note:l.note||'', delivered:false, supplierId:l.supplierId||'', supplierName:l.supplierName||''});
        continue;
      }
      const item = byId(state.data.items, l.itemId);
      if(!item) continue;
      const orderType = 'stock';
      let delivered = false;
      let sourceWarehouses = [];
      let handedOver = true;
      if(orderType==='stock'){
        const available = totalStock(item);
        delivered = available >= l.qty;
        if(delivered){
          const moveResult = await deductStockAcrossWarehouses(item, l.qty);
          sourceWarehouses = moveResult.sources;
          handedOver = !moveResult.movedToVendido; // si se movió a "Vendido", falta entregarlo de verdad
          await addDoc('movements', {type:'reserva', itemId:item.id, itemName:item.name, sku:item.sku||'', qty:l.qty, clientName, pedidoId:pedidoNumber||nextPedido(), sellerId:seller?seller.id:null, storeId:m.storeId, storeName:storeName(m.storeId), actorName: seller?seller.name:'Administrador', status:'activo'});
        }
      }
      finalItems.push({id:'L'+(lineSeq++), itemId:item.id, itemName:item.name, sku:item.sku||'', qty:l.qty, orderType, note:l.note||'', delivered, sourceWarehouses, handedOver});
    }
    const savedId = await addDoc('sales', {
      storeId:m.storeId, storeName:storeName(m.storeId),
      clientName, pedidoNumber, itemsText:get('itemsText'),
      items:finalItems,
      total, deposit:Number(get('deposit'))||0, method:get('method'), status:get('status'),
      sellerName: seller?seller.name:'Administrador',
    });
    if(!savedId){
      // El guardado falló (ya se mostró el aviso de error): no cerramos el formulario
      // para que no se pierda lo escrito y se pueda reintentar.
      return;
    }
    showToast(finalItems.some(l=>!l.delivered) ? 'Venta registrada · hay artículos pendientes de entrada.' : 'Venta registrada.');
    state.saleDraftItems = [];
    state.modal = null; render();
  }

      const cols = ['stores','warehouses','suppliers','familyGroups','families','sellers','items','movements','sales','cash'];
      for(const col of cols){

        if(!Array.isArray(rows)) continue;

          await setDoc(col+'/'+id, rest);

  async function extractAlbaranFile(file){
    const diag = document.getElementById('import-diag');
    const setDiag = (msg)=>{ if(diag) diag.textContent = msg; };
    if(!file) return;
    const whId = (document.querySelector('[data-field="importWarehouse"]')||{}).value;
    const supplierId = (document.querySelector('[data-field="importSupplier"]')||{}).value;
    if(!whId || !supplierId){
      setDiag('Elige primero el almacén y el fabricante, y vuelve a subir el archivo.');
      const fi = document.getElementById('import-file'); if(fi) fi.value = '';
      return;
    }
    let blobs = [];
    try{
      if(file.type === 'application/pdf'){
        setDiag('Convirtiendo el PDF a imagen…');
        if(typeof pdfjsLib === 'undefined'){ setDiag('No se pudo cargar el lector de PDF. Prueba a subir una foto en su lugar.'); return; }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data:buf}).promise;
        const maxPages = Math.min(pdf.numPages, 4);
        for(let p=1;p<=maxPages;p++){
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({scale:2});
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
          const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
          if(blob) blobs.push(blob);
        }
      } else if(file.type.startsWith('image/')){
        blobs = [file];
      } else {
        setDiag('Formato no admitido. Sube un PDF o una foto (JPG/PNG).');
        return;
      }
    }catch(e){ setDiag('No se pudo leer el archivo: '+(e&&e.message?e.message:e)); return; }

    setDiag('Leyendo productos con IA…');
    let sample;
    try{ sample = await claude.use('sample'); }catch(e){ sample = null; }
    if(!sample){ setDiag('La lectura con IA no está disponible en esta vista. Escribe los productos a mano abajo.'); return; }
    try{
      const limits = await sample.limits();
      if(!limits || !limits.images){
        setDiag('Esta vista no admite enviar fotos a la IA (limitación de esta pantalla, no del archivo). Pega la lista de productos a mano abajo — pídemela en el chat a partir de la foto del albarán.');
        return;
      }
    }catch(e){ /* if limits() itself fails, still try the call below */ }
    try{
      const data = await sample.json(
        'Este documento es un albarán o factura de entrega de un proveedor de sofás/muebles/tapicería. '
        + 'Extrae cada línea de producto que aparezca (ignora totales, IVA, portes y datos de la empresa). '
        + 'Responde ÚNICAMENTE con un array JSON de objetos: {"sku": string, "name": string, "qty": number, "price": number}. '
        + 'Usa "" en sku si no hay referencia visible, y 0 en price si no hay precio unitario. No inventes productos que no estén en el documento.',
        {images: blobs, modelTier:'default'}
      );
      if(!Array.isArray(data) || data.length===0){ setDiag('No se han detectado productos. Puedes escribirlos a mano abajo.'); return; }
      const lines = data.map(d=>[d.sku||'', d.name||'', Math.max(0,Number(d.qty)||0), Number(d.price)||0].join(';'));
      const ta = document.getElementById('import-text');
      if(ta) ta.value = lines.join('\n');
      setDiag(data.length+' producto(s) detectado(s). Dando entrada automáticamente…');
      await saveImport();
    }catch(e){
      const code = e && e.code ? e.code : 'error';
      setDiag('No se pudo leer el documento (' + code + '). Puedes escribir los productos a mano abajo.');
    }
  }
  async function saveImport(){
    const whId = (document.querySelector('[data-field="importWarehouse"]')||{}).value;
    if(!whId){ showToast('Elige el almacén de destino.'); return; }
    const supplierId = (document.querySelector('[data-field="importSupplier"]')||{}).value;
    if(!supplierId){ showToast('Elige el fabricante / proveedor.'); return; }
    const raw = (document.getElementById('import-text')||{}).value || '';
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ showToast('Sube el albarán o escribe al menos una línea.'); return; }
    let created=0, updated=0;
    for(const line of lines){
      const parts = line.split(';').map(p=>p.trim());
      const sku = parts[0]||''; const name = parts[1]||sku||'Artículo sin nombre';
      const qty = Math.max(0, Number(parts[2])||0);
      const price = Number(parts[3])||0;
      // Columnas opcionales: Familia;Medida;Tela/color
      const famName = (parts[4]||'').toLowerCase();
      const fam = famName ? state.data.families.find(f=>String(f.name||'').trim().toLowerCase()===famName) : null;
      const extra = {};
      if(fam) extra.familyId = fam.id;
      if(parts[5]) extra.measure = parts[5];
      if(parts[6]) extra.material = parts[6];
      if(!sku && !name) continue;
      if(qty<=0) continue;
      let item = state.data.items.find(i=>String(i.sku||'').toLowerCase()===sku.toLowerCase() && sku);
      let itemId, unitPrice;
      if(item){
        const newStock = {...(item.stock||{})};
        newStock[whId] = (Number(newStock[whId])||0) + qty;
        const ok = await updateDoc('items', item.id, {stock:newStock});
        if(!ok) continue;
        itemId = item.id; unitPrice = price||Number(item.price)||0;
        updated++;
      } else {
        const newId = await addDoc('items', {name, sku, price, supplierId, ...extra, stock:{[whId]: qty}});
        if(!newId) continue;
        itemId = newId; unitPrice = price;
        created++;
      }
      await addDoc('movements', {type:'entrada', itemId, itemName:name, sku, qty, warehouseId:whId, warehouseName:warehouseName(whId), unitPrice, total:unitPrice*qty, actorName:'Administrador', status:'activo'});
    }
    showToast(`Importado: ${created} artículo(s) nuevo(s), ${updated} con stock sumado.`);
    state.modal = null; render();
  }

  function onAction(e){
    const el = e.currentTarget;
    const action = el.dataset.action;
    switch(action){
      case 'enter-admin':
        if(getSettings().adminPassword){ state.modal = {kind:'adminAuth'}; render(); }
        else { state.role='admin'; state.adminTab='almacen'; render(); }
        break;
      case 'enter-seller': state.role='seller'; state.sellerId=null; render(); break;
      case 'exit': state.role=null; state.sellerId=null; state.modal=null; render(); break;
      case 'admin-tab': state.adminTab = el.dataset.tab; render(); break;
      case 'config-tab': state.configTab = el.dataset.tab; render(); break;
      case 'seller-tab': state.sellerTab = el.dataset.tab; render(); break;
      case 'stock-view': state.stockView = el.dataset.view; render(); break;
      case 'valor-view': state.valorView = el.dataset.view; render(); break;
      case 'ventas-view': state.ventasView = el.dataset.view; render(); break;
      case 'toggle-mov-actions': state.movActionsOpen = !state.movActionsOpen; render(); break;
      case 'entities-type': state.entitiesType = el.dataset.type; render(); break;
      case 'mov-filter': state.movFilter = el.dataset.filter; render(); break;
      case 'open-add': state.modal = {kind:'entity', mode:'add', entity: el.dataset.entity, id:null, presets:null}; render(); break;
      case 'open-edit': state.modal = {kind:'entity', mode:'edit', entity: el.dataset.entity, id: el.dataset.id}; render(); break;
      case 'close-modal': closeModal(); break;
      case 'save-modal': saveModal(); break;
      case 'delete':
        if(window.confirm('¿Eliminar este elemento?')){ deleteDocById(el.dataset.entity, el.dataset.id).then(()=>showToast('Eliminado.')); }
        break;
      case 'reserve': state.modal = {kind:'movement', type:'reserva', itemId: el.dataset.id}; render(); break;
      case 'expose': state.modal = {kind:'movement', type:'exposicion', itemId: el.dataset.id}; render(); break;
      case 'mark-sold': state.modal = {kind:'movement', type:'vendido', itemId: el.dataset.id}; render(); break;
      case 'open-movement': state.modal = {kind:'movement', type: el.dataset.type, itemId:null}; render(); break;
      case 'open-import': state.modal = {kind:'import'}; render(); break;
      case 'save-import': saveImport(); break;
      case 'save-movement': saveMovement(); break;
      case 'cancel-movement': cancelMovement(el.dataset.id); break;
      case 'cash-move': state.modal = {kind:'cash', type: el.dataset.type, storeId: el.dataset.store}; render(); break;
      case 'save-cash': saveCash(); break;
      case 'open-sale': state.saleDraftItems = []; state.modal = {kind:'sale', storeId: el.dataset.store}; render(); break;
      case 'save-sale': saveSale(); break;
      case 'add-sale-item': addSaleItem(); break;
      case 'remove-sale-item': removeSaleItem(Number(el.dataset.idx)); break;
      case 'entrada-destino': state.modal.destino = el.dataset.destino; render(); break;
      case 'quick-add': quickAdd(el.dataset.entity); render(); break;
      case 'pvp-add': {
        const sup = byId(state.data.suppliers, el.dataset.id);
        if(sup) saveSupplierPvp(sup.id, [...supplierPvpList(sup), {label:'', value:''}], false);
        break;
      }
      case 'pvp-remove': {
        const sup = byId(state.data.suppliers, el.dataset.id);
        if(!sup) break;
        const list = supplierPvpList(sup).slice();
        list.splice(Number(el.dataset.idx), 1);

      case 'quick-add-group': quickAddGroup(); break;
      case 'add-subfamily': addSubfamily(el.dataset.group); break;
      case 'delete-group': if(window.confirm('¿Eliminar esta familia y sus subfamilias?')){ deleteGroupCascade(el.dataset.id); } break;
    }
  }

  render();
  initDb();
  initUser();
})();
</script>
</body>
</html>
